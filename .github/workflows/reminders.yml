# Pings the app every hour so it sends event reminders. Render free tier
# has no cron so this is the scheduler. Also wakes the dyno up.
name: send reminders

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: call /tasks/send-reminders
        run: |
          curl --fail --silent --show-error -X POST \
            -H "X-Tasks-Token: ${{ secrets.TASKS_TOKEN }}" \
            https://rays-of-hope.onrender.com/tasks/send-reminders
