<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · Rays of Hope</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  {% include 'header.html' %}
  <main class="content auth-layout auth-card">
    <h1>My Profile</h1>
    <form action="{{ url_for('update_profile_display_name') }}" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" >
      <label for="display_name">Display Name: </label>
      <input
        id="display_name"
        name="display_name"
        class="display-name-input"
        type="text"
        value="{{ current_user.display_name or '' }}"
        maxlength="80"
        required
        >
        <button type="submit" class="button site-nav-button">Save</button>
    </form>
    <p>Email: {{ current_user.email }}</p>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="button site-nav-button">Log out</button>
    </form>
  </main>
  {% include 'footer.html' %}
</body>
</html>
