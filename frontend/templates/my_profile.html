<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · Rays of Hope</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  {% include 'header.html' %}
  <main class="content auth-layout auth-card">
    <h1>My Profile</h1>
    <form action="/my-profile" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="create-event-card">
        Name
        <input name="display_name" type="text"
               value="{{ current_user.display_name or '' }}" autocomplete="name"
               maxlength="100" pattern=".*\S.*" title="Name can't be blank." required>
      </label>
      <button type="submit" class="action-button action-primary">Save</button>
    </form>
    <p>Email: {{ current_user.email }}</p>

    <h2>Notifications</h2>
    <form action="/my-profile/notifications" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <p>Email me when:</p>
      <label><input type="checkbox" name="notify_new_event" {% if prefs.notify_new_event %}checked{% endif %}>
        a new event is posted</label><br>
      <label><input type="checkbox" name="notify_rsvp" {% if prefs.notify_rsvp %}checked{% endif %}>
        I RSVP to an event</label><br>
      <label><input type="checkbox" name="notify_changes" {% if prefs.notify_changes %}checked{% endif %}>
        an event I RSVP'd to changes</label><br>
      <label><input type="checkbox" name="notify_reminder" {% if prefs.notify_reminder %}checked{% endif %}>
        an event I RSVP'd to is tomorrow (reminder)</label>
      <label class="create-event-card">
        Phone (optional)
        <input name="phone" type="tel" value="{{ prefs.phone }}" autocomplete="tel" maxlength="20">
      </label>
      <label><input type="checkbox" name="notify_sms" {% if prefs.notify_sms %}checked{% endif %}>
        also text me reminders</label><br>
      <button type="submit" class="action-button action-primary">Save</button>
    </form>
    <form action="/logout" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="button site-nav-button">Log out</button>
    </form>
  </main>
  {% include 'footer.html' %}
</body>
</html>
