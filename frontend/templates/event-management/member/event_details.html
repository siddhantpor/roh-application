<!DOCTYPE html>
<html>
  <head>

  </head>
  <body>
    {% include 'header.html' %}
    <!-- TODO: Back button. -->

    <!-- TODO: Integrate w/ Cloudinary. -->

    <h4>{{ event.date }}, {{ event.start_time }}-{{ event.end_time }}</h4>
