<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rays of Hope</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    {% include 'header.html' %}
    <main class="content">
    <div class="header-row">
      <a href="/admin/events/{{ event_id }}" class="button button-shadow square-button">&lt;</a>
      <h1 class="header-bold">Attendees</h1>
    </div>

    <div>
      <p class="number-bold">{{ going }}</p>
      <p>Going</p>
    </div>
    <div>
      <p class="number-bold">{{ pending }}</p>
      <p>Pending</p>
    </div>
    <div>
      <p class="number-bold">{{ not_going }}</p>
      <p>Not Going</p>
    </div>

    <!-- TODO: Search bar. -->

    {% for member in members %}
      <div>
        <p class="subtext-bold text-dark-gray">{{ member.name }}</p>
        <p class="caption">{{ member.status }}</p>
      </div>
    {% endfor %}

    </main>
    {% include 'footer.html' %}
  </body>
</html>
