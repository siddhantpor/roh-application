<!DOCTYPE html>
<html>
  <head>
    <title>Rays of Hope</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    {% include 'header.html' %}
    <a href="/admin/events" class="button button-shadow square-button">&lt;</a>

    <!-- TODO: Sync w/ Cloudinary storage. -->
    {% if event.flyer %}
      <img src="{{ event.flyer }}">
    {% endif %}

    <p class="text-gray">{{ event.date }}, {{ event.start_time }}-{{ event.end_time }}</p>
    <h1 class="header-bold">{{ event.title }}</h1>
    <p class="subtext text-dark-gray">{{ event.location }} · {{ event.attending }} Members Attending</p>

    <p><strong>About</strong></p>
    <p>{{ event.description }}</p>

    <a href="/admin/events/{{ event.id }}/attendees">View Attendees</a>

    {% include 'footer.html' %}
  </body>
</html>
