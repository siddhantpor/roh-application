<!DOCTYPE html>
<html>
  <head>
    <title>Rays of Hope</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    {% include 'header.html' %}
    <!-- TODO: Back button. -->

    <!-- TODO: Sync w/ Cloudinary storage. -->
    {% if event.flyer %}
      <img src="{{ event.flyer }}">
    {% endif %}

    <h4>{{ event.date }}, {{ event.start_time }}-{{ event.end_time }}</h4>
    <h1>{{ event.title }}</h1>
    <h5>{{ event.location }} · {{ event.attending }} Members Attending</h5>

    <p><strong>About</strong></p>
    <p>{{ event.description }}</p>

    <a href="/admin/events/{{ event.id }}/attendees">View Attendees</a>

    {% include 'footer.html' %}
  </body>
</html>
