<!DOCTYPE html>
<html>
  <head>
    <title>Rays of Hope</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    {% include 'header.html' %}
    <h1 class="header text-center">Hello Admin!</h1> <!-- TODO: Replace `Admin` w/ user's first name. -->

    <div class="button-row">
      <a href="/admin/events/create" class="button button-shadow home-button">Create an Event</a>
      <a href="/admin/members" class="button button-shadow home-button">Manage Members</a>
    </div>

    <p class="caption section-pill">Events</p>

    <div>
      <form method="get" id="date-filter">
        <div class="create-event-card-row">
          <label class="create-event-card">
            <strong>Start Date</strong>
            <input type="date" name="start_date" id="start_date">
          </label>

          <label class="create-event-card">
            <strong>End Date</strong>
            <input type="date" name="end_date" id="end_date">
          </label>
        </div>
      </form>
    </div>

    <div id="event-list">
      {% include 'event-management/admin/_event_list.html' %}
    </div>

    <script>
      const startDate = document.querySelector('#start_date');
      const endDate = document.querySelector('#end_date');

      async function updateEvents() {
        if (startDate.value && endDate.value && startDate.value > endDate.value) return;

        const params = new URLSearchParams({
          start_date: startDate.value,
          end_date: endDate.value,
          ajax: '1'
        });

        const response = await fetch(`/admin/events?${params}`);
        if (!response.ok) return;
        const data = await response.json();
        document.querySelector('#event-list').innerHTML = data.html;
      }

      startDate.addEventListener('change', updateEvents);
      endDate.addEventListener('change', updateEvents);
      document.querySelector('#date-filter').addEventListener('submit', event => {
        event.preventDefault();
        updateEvents();
      });
    </script>

    {% include 'footer.html' %}
  </body>
</html>
