<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Edit' if event else 'Create' }} Event · Rays of Hope</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    {% include 'header.html' %}
    <main class="content">
    <div class="header-row">
      <a href="{{ url_for('admin_event_detail', event_id=event.event_id) if event else url_for('events') }}" class="button button-shadow square-button">&lt;</a>
      <h1 class="header-bold page-title">{{ 'Edit Event' if event else 'Create an Event' }}</h1>
    </div>
    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="create-event-card">
        <strong>Event Title <span class="text-red">*</span></strong>
        <input type="text" name="title" placeholder="e.g., Leadership Workshop" value="{{ values.get('title', '') }}" maxlength="200" required>
      </label>
      <label class="create-event-card">
        <strong>Date <span class="text-red">*</span></strong>
        <input type="date" name="date" value="{{ values.get('date', '') }}" required>
      </label>
      <div class="create-event-card-row">
        <label class="create-event-card">
          <strong>Start Time <span class="text-red">*</span></strong>
          <input type="time" name="start_time" value="{{ values.get('start_time', '') }}" required>
        </label>
        <label class="create-event-card">
          <strong>End Time <span class="text-red">*</span></strong>
          <input type="time" name="end_time" value="{{ values.get('end_time', '') }}" required>
        </label>
      </div>
      <div class="create-event-card location-field">
        <label for="location-input"><strong>Location <span class="text-red">*</span></strong></label>
        <input type="text" id="location-input" name="location" placeholder="e.g., Princeton Public Library" value="{{ values.get('location', '') }}" maxlength="300" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="location-suggestions" required>
        <ul id="location-suggestions" class="location-suggestions" role="listbox" hidden></ul>
      </div>
      <label class="create-event-card">
        <strong>Description</strong>
        <textarea name="description" placeholder="Tell volunteers about this event (what to expect, the dress code, etc.)" maxlength="10000">{{ values.get('description', '') or '' }}</textarea>
      </label>
      {% if event and event.graphic_link %}
        <img class="event-poster" src="{{ event.graphic_link }}" alt="Current poster for {{ event.event_title }}">
        <label><input type="checkbox" name="remove_poster" value="yes"> Remove current flyer</label>
      {% endif %}
      <label class="create-event-card">
        <strong>{{ 'Replace Flyer' if event else 'Event Flyer' }}</strong>
        <input type="file" name="flyer" accept="image/jpeg,image/png,image/webp">
        <span>JPEG, PNG, or WebP, up to 5 MB and 25 megapixels.</span>
      </label>
      <button type="submit" class="button create-event-button button-yellow">{{ 'Save Changes' if event else 'Create Event' }}</button>
    </form>
    </main>
    {% include 'footer.html' %}
    <script>
      (function () {
        var input = document.getElementById('location-input');
        var list = document.getElementById('location-suggestions');
        var timer = null, seq = 0, active = -1, items = [];

        function close() { list.hidden = true; input.setAttribute('aria-expanded', 'false'); active = -1; }
        function setActive(i) {
          var els = list.children;
          if (active >= 0 && els[active]) els[active].classList.remove('active');
          active = i;
          if (els[i]) { els[i].classList.add('active'); els[i].scrollIntoView({block: 'nearest'}); }
        }
        function pick(text) { input.value = text; close(); }
        function render(results) {
          items = results;
          list.textContent = '';
          if (!results.length) { close(); return; }
          results.forEach(function (text) {
            var li = document.createElement('li');
            li.setAttribute('role', 'option');
            li.textContent = text;
            li.addEventListener('mousedown', function (e) { e.preventDefault(); pick(text); });
            list.appendChild(li);
          });
          list.hidden = false;
          input.setAttribute('aria-expanded', 'true');
        }

        input.addEventListener('input', function () {
          clearTimeout(timer);
          var q = input.value.trim();
          if (q.length < 3) { seq++; close(); return; }
          var mine = ++seq;
          timer = setTimeout(function () {
            fetch('/admin/places/search?q=' + encodeURIComponent(q), {credentials: 'same-origin'})
              .then(function (r) { return r.ok ? r.json() : []; })
              .then(function (results) { if (mine === seq) render(results); })
              .catch(function () {});
          }, 300);
        });
        input.addEventListener('keydown', function (e) {
          if (list.hidden) return;
          if (e.key === 'ArrowDown') { e.preventDefault(); setActive((active + 1) % items.length); }
          else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((active - 1 + items.length) % items.length); }
          else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(items[active]); }
          else if (e.key === 'Escape') { close(); }
        });
        input.addEventListener('blur', close);
      })();
    </script>
  </body>
</html>
