<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ 'Edit' if event else 'Create' }} Event · Rays of Hope</title>
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    {% include 'header.html' %}
    <main class="content">
    <div class="header-row">
      <a href="{{ url_for('events.admin_events') }}" class="button button-shadow square-button">&lt;</a>
      <h1 class="header-bold">{{ 'Edit' if event else 'Create' }} an Event</h1>
    </div>
    <form method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="create-event-card">
        <strong>Event Title *</strong>
        <input type="text" name="title" value="{{ values.get('title', '') }}" maxlength="200" required>
      </label>
      <label class="create-event-card">
        <strong>Date *</strong>
        <input type="date" name="date" value="{{ values.get('date', '') }}" required>
      </label>
      <div class="create-event-card-row">
        <label class="create-event-card">
          <strong>Start Time *</strong>
          <input type="time" name="start_time" value="{{ values.get('start_time', '') }}" required>
        </label>
        <label class="create-event-card">
          <strong>End Time *</strong>
          <input type="time" name="end_time" value="{{ values.get('end_time', '') }}" required>
        </label>
      </div>
      <label class="create-event-card">
        <strong>Location *</strong>
        <input type="text" name="location" value="{{ values.get('location', '') }}" maxlength="300" required>
      </label>
      <label class="create-event-card">
        <strong>Description</strong>
        <textarea name="description" maxlength="10000">{{ values.get('description', '') or '' }}</textarea>
      </label>
      <button type="submit" class="button create-event-button button-yellow">Save Event</button>
    </form>
    </main>
    {% include 'footer.html' %}
  </body>
</html>
