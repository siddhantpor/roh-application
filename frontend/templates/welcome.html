<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome · Rays of Hope</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% include 'header.html' %}
  <main class="content auth-layout">
    <section class="auth-card" aria-labelledby="welcome-title">
      <img class="welcome-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="Rays of Hope logo" width="76" height="76">
      <h1 id="welcome-title">Welcome to the community</h1>
      <p>Already a member? Log in to your volunteer portal.</p>
      <a class="action-button action-primary" href="{{ url_for('login') }}">Log in</a>
      <a class="action-button action-secondary" href="{{ url_for('signup') }}">Create an account</a>
      <p class="auth-note">New here? Create your account and verify your email. An admin will review your membership before you can access events.</p>
    </section>
  </main>
  {% include 'footer.html' %}
</body>
</html>
